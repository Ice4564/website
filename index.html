  <script>
    const entry=document.querySelector('#entry'),audio=document.querySelector('#audio'),playAudio=document.querySelector('#playAudio'),progress=document.querySelector('#progress'),time=document.querySelector('#time'),dialog=document.querySelector('#appleDialog'),video=document.querySelector('#bgVideo');document.querySelectorAll('.heading,.card,.profile .avatar,.profile .identity,.profile .profile-state,.links .link,.bottom,.audio-bar').forEach(el=>el.classList.add('assemble'));function fmt(n){if(!Number.isFinite(n))return'0:00';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}function updateAudio(){playAudio.textContent=audio.paused?'▶':'Ⅱ';playAudio.setAttribute('aria-label',audio.paused?'เล่นเพลง':'หยุดเพลง');if(audio.duration){progress.value=audio.currentTime/audio.duration*100;time.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)}}document.querySelector('#enter').addEventListener('click',()=>{entry.classList.add('done');audio.play().catch(()=>{});setTimeout(()=>document.body.classList.add('assembled'),320)});playAudio.addEventListener('click',()=>audio.paused?audio.play().catch(()=>{}):audio.pause());audio.addEventListener('timeupdate',updateAudio);audio.addEventListener('loadedmetadata',updateAudio);audio.addEventListener('play',updateAudio);audio.addEventListener('pause',updateAudio);progress.addEventListener('input',()=>{if(audio.duration)audio.currentTime=Number(progress.value)/100*audio.duration});video.addEventListener('loadeddata',()=>video.classList.add('active'));video.addEventListener('error',()=>{});document.querySelector('#openApple').addEventListener('click',()=>dialog.showModal());document.querySelector('#closeApple').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});window.addEventListener('pagehide',()=>audio.pause());
